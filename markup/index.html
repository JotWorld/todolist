<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <h1>Список задач</h1>
    </header>

    <section class="task-form">
        <h2>Новая задача</h2>
        <div class="input-container">
            <input type="text" placeholder="Название задачи...">
            <button id="add">+ Добавить</button>
        </div>
    </section>

    <section class="task-board">
        <div class="task-group">
            <div class="task-header backlog-header">Бэклог</div>
            <ul class="task-column backlog">
                <li>Выучить JS</li>
                <li>Выучить React</li>
                <li>Сделать домашку</li>
            </ul>
        </div>

        <div class="task-group">
            <div class="task-header process-header">В процессе</div>
            <ul class="task-column in-process">
                <li>Выпить смузи</li>
                <li>Попить воды</li>
            </ul>
        </div>

        <div class="task-group">
            <div class="task-header done-header">Готово</div>
            <ul class="task-column done">
                <li>Позвонить маме</li>
                <li>Погладить кота</li>
            </ul>
        </div>

        <div class="task-group">
            <div class="task-header trash-header">Корзина</div>
            <ul class="task-column trash">
                <li>Сходить погулять</li>
                <li>Прочитать "Войну и мир"</li>
            </ul>
            <button id="button">✖ Очистить</button>
        </div>
    </section>

    <script src="index.js" type="module"></script>
</body>
</html>
